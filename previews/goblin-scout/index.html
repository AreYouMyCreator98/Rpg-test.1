<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Red Cowl — draft asset review</title><style>body{margin:0;background:#19221f;color:#eadfc5;font:16px system-ui}canvas{display:block;width:100vw;height:100dvh}aside{position:fixed;top:12px;left:12px;right:12px;background:#15231cda;padding:12px;border-radius:12px}select,button{font:inherit;padding:8px;background:#283a31;color:inherit;border:1px solid #9c885f;border-radius:6px}small{display:block;margin-top:8px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"}}</script><aside><strong>Red Cowl · Draft model</strong> <select aria-label="Animation" id="clip"></select><button id="turn">Rotate</button><small>Review asset only. This does not change the game or your saves.</small></aside><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#19221f');const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));document.body.append(renderer.domElement);renderer.toneMapping=THREE.ACESFilmicToneMapping;
