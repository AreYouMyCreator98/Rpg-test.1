name: Validate game release

on:
  push:
    branches: [main]
    paths:
      - river-details.js
      - graphics.js
      - terrain-stream.js
      - environment-life.js
      - emerald-landscape.js
      - emerald-vale.js
      - assets/environment/**
      - environment-art.js
      - account-storage.js
      - scout-model.js
      - assets/goblin-scout.gltf
      - assets/models/goblin_scout.glb
      - assets/models/goblin_scout_lod.glb
      - scene-batch.js
      - gathering.js
      - gathering-rules.js
      - homestead.js
      - building-rules.js
      - prologue.js
      - accounts.js
      - supabase/game-catalog.json
      - expansion-data.js
      - expansion-models.js
      - expansion-world.js
      - companions.js
      - progression.js
      - adventure-motion.js
      - index.html
      - visual-world.js
      - ui.css
      - ui.js
      - frontier.js
      - living-world.js
      - multiplayer.js
      - multiplayer-config.js
      - supabase-rooms.js
      - scripts/stage-pages.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# Settings → Pages already publishes main / (root). Keep exactly one publisher.
# This workflow validates the versioned source files; it must not deploy a second artifact.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate the static release
        run: python scripts/stage-pages.py
